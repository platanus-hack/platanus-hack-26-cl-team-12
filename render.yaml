# Blueprint de Render (infra como código). Se despliega desde el espejo personal rlabbev/puente:
# Render no puede conectarse a repos de la organización. Guía: docs/DESPLIEGUE.md.
#
# Auto-deploy apagado: despliega el CD (.github/workflows/cd.yml) con los Deploy Hooks, solo si el CI pasó.
# Secretos (sync: false): Render los pide UNA vez, al crear el Blueprint. Después se cambian en el panel.
# Si cambias un nombre de servicio, cambia también las URLs *.onrender.com de abajo y la variable PUBLIC_API_URL del CD.

services:
  # ── API (FastAPI): /health, /token, /glosses, /llamadas ─────────────────────
  - type: web
    name: puente-api
    runtime: docker
    region: ohio
    plan: free # se duerme tras inactividad (~1 min en despertar): súbelo a starter antes de la demo
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: . # la raíz: el Dockerfile copia packages/glosses y lab/
    healthCheckPath: /health
    autoDeployTrigger: "off"
    envVars:
      - key: ESCENARIO # el traductor de la llamada real (glosas ↔ español) usa el escenario de la ambulancia
        value: urgencia_caida
      - key: PORT
        value: "8000" # el CMD del Dockerfile escucha en 8000 (Render asume 10000)
      - key: API_ENV
        value: production
      - key: CORS_ORIGINS
        # PWA + WebView de Capacitor: Android (https://localhost) e iOS (capacitor://localhost). Nunca "*".
        value: https://puente-web.onrender.com,https://localhost,capacitor://localhost
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: ALLOWED_DESTINATIONS
        sync: false
      # Teléfono al que llaman los contactos de la app (la web manda solo `destino`). Sin esto POST /llamadas da 422.
      # Debe estar también en ALLOWED_DESTINATIONS.
      - key: NUMERO_DEMO
        sync: false
      # Telefonía plan C (app/twilio_media.py): Twilio llama a /twilio/* y Claude simplifica (app/llamada.py).
      - key: PUBLIC_BASE_URL
        value: https://puente-api.onrender.com
      - key: ANTHROPIC_API_KEY
        sync: false
      # POST /llamadas crea la llamada con la API de Twilio (sin ellas responde 503).
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      # Auth mínima (A4): firma de Twilio en los POST y token del WebSocket /twilio/cliente.
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: CLIENTE_WS_TOKEN
        sync: false
      - key: LLAMADA_MAX_MIN
        value: "240" # duración máxima de cada llamada en minutos (cuenta pagada de Twilio)
      # Voz chilena de lo que escucha el ejecutivo (app/voz.py). Sin clave, Twilio usa su voz es-MX.
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: Fd38GRHtJllY0CuguAy9 # voz chilena mujer (ADR-0006); no es secreto
      - key: ELEVENLABS_VOICE_ID_HOMBRE
        value: 6WgXEzo1HGn3i7ilT4Fh

  # ── Agente (LiveKit Agents): proceso largo, sin puerto ──────────────────────
  - type: worker
    name: puente-agent
    runtime: docker
    region: ohio
    plan: starter # los workers no tienen plan gratuito
    dockerfilePath: ./services/agent/Dockerfile
    dockerContext: .
    autoDeployTrigger: "off"
    envVars:
      - key: ESCENARIO
        value: hora_medica
      - key: AGENT_DB_PATH
        value: /tmp/puente.db
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        value: Fd38GRHtJllY0CuguAy9 # voz chilena mujer (ADR-0006); no es secreto
      - key: ELEVENLABS_VOICE_ID_HOMBRE
        value: 6WgXEzo1HGn3i7ilT4Fh

  # ── PWA (Next.js export estático) ───────────────────────────────────────────
  - type: web
    name: puente-web
    runtime: static
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @puente/web build
    staticPublishPath: ./apps/web/out
    autoDeployTrigger: "off"
    envVars:
      - key: NEXT_PUBLIC_API_URL # se hornea en el build: si cambia, hay que redesplegar la web
        value: https://puente-api.onrender.com
      - key: NODE_VERSION
        value: "22"
      # El mismo valor que CLIENTE_WS_TOKEN de puente-api: sin esto la API cierra el WebSocket (1008) y no hay llamada.
      - key: NEXT_PUBLIC_CLIENTE_WS_TOKEN
        sync: false
      - key: NEXT_PUBLIC_SENAS_URL # fotos de señas en S3 (https://<bucket>.s3.<región>.amazonaws.com/senas)
        sync: false
