<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Puente — Ejecutivo</title>
<style>
body{font-family:system-ui;max-width:520px;margin:24px auto;padding:0 16px}
button{font-size:18px;padding:14px 20px;border-radius:12px;border:0;background:#1d4ed8;color:#fff;width:100%}
button.rec{background:#dc2626}
.m{padding:10px 12px;border-radius:10px;margin:8px 0}.yo{background:#e0e7ff}.cli{background:#dcfce7}.err{background:#fee2e2}
small{color:#666}
</style>
<h2>📞 Ejecutivo</h2>
<label><input type=checkbox id=v2 checked> v2: simplificar para el cliente</label>
<label><input type=checkbox id=v4 checked> v4: mostrar señas al cliente</label>
<p><button id=b>🎙️ Hablar</button></p>
<small id=estado>Haz clic en Hablar, di tu frase y vuelve a hacer clic para enviarla. Usa audífonos.</small>
<div id=log></div>
<script>
const log=document.getElementById('log'),b=document.getElementById('b'),est=document.getElementById('estado');
const add=(c,t)=>{const d=document.createElement('div');d.className='m '+c;d.textContent=t;log.prepend(d)};
let ws,rec,chunks=[];
function conectar(){
  ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host+'/ws/ejecutivo');
  ws.onclose=()=>setTimeout(conectar,1000);
  ws.onmessage=e=>{const m=JSON.parse(e.data);
    if(m.tipo=='transcripcion')add('yo','Tú: '+m.texto);
    if(m.tipo=='cliente_dice'){add('cli','Cliente: '+m.texto+'  ['+m.ms.llm+' ms IA · '+m.ms.tts+' ms voz]');
      new Audio('data:audio/mpeg;base64,'+m.audio).play()}
    if(m.tipo=='error')add('err',m.texto)}}
conectar();
b.onclick=async()=>{
  if(rec&&rec.state=='recording'){rec.stop();return}
  const s=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
  chunks=[];rec=new MediaRecorder(s);
  rec.ondataavailable=e=>chunks.push(e.data);
  rec.onstop=async()=>{s.getTracks().forEach(t=>t.stop());b.classList.remove('rec');b.textContent='🎙️ Hablar';
    const blob=new Blob(chunks,{type:rec.mimeType});
    const buf=new Uint8Array(await blob.arrayBuffer());let bin='';for(let i=0;i<buf.length;i+=8192)bin+=String.fromCharCode(...buf.subarray(i,i+8192));
    ws.send(JSON.stringify({data:btoa(bin),mime:rec.mimeType,v2:document.getElementById('v2').checked,v4:document.getElementById('v4').checked}));est.textContent='Transcribiendo…'};
  rec.start();b.classList.add('rec');b.textContent='⏹️ Enviar';est.textContent='Grabando…'};
</script>
