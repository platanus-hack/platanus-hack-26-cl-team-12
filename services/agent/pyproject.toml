[project]
name = "puente-agent"
version = "0.0.0"
description = "Agente traductor de Puente: LiveKit Agents + Deepgram (STT) + Claude + ElevenLabs (TTS)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "livekit-agents[deepgram,elevenlabs,silero]>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
