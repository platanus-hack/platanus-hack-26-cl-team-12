[project]
name = "puente-agent"
version = "0.0.0"
description = "Agente traductor de Puente: LiveKit Agents + Deepgram (STT) + Claude + ElevenLabs (TTS)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "python-dotenv>=1.0",
    "livekit-agents[deepgram,elevenlabs,silero]>=1.0",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["db"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]  # prompts y docstrings largos en español: el largo no es un problema real
