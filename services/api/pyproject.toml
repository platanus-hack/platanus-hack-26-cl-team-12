[project]
name = "puente-api"
version = "0.0.0"
description = "API de Puente: tokens de LiveKit, llamadas SIP salientes y diccionario de glosas"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-dotenv>=1.0",
    "livekit-api>=0.8",
    "twilio>=9.0",
    "python-multipart>=0.0.34",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.28"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
