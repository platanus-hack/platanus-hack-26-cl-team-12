<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puente — prueba del cliente</title>
<!-- Solo para probar v1 sin la PWA. La app real (apps/web, Rafael) usa el mismo WebSocket /twilio/cliente. -->
<style>
  :root { color-scheme: light dark; --bg:#0f1115; --fg:#f3f4f6; --muted:#9ca3af; --ej:#1f2937; --cl:#1d4ed8; }
  @media (prefers-color-scheme: light) { :root { --bg:#f8fafc; --fg:#0f172a; --muted:#64748b; --ej:#e2e8f0; --cl:#2563eb; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:18px/1.4 system-ui, sans-serif; display:flex; flex-direction:column; height:100dvh; }
  header { padding:12px 16px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #8883; }
  #estado { font-size:14px; color:var(--muted); }
  #chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:85%; padding:10px 14px; border-radius:14px; white-space:pre-wrap; }
  .ej { background:var(--ej); align-self:flex-start; font-size:22px; }
  .ej small { display:block; font-size:13px; color:var(--muted); margin-top:6px; }
  .cl { background:var(--cl); color:#fff; align-self:flex-end; }
  .sis { align-self:center; font-size:14px; color:var(--muted); }
  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid #8883; flex-wrap:wrap; }
  input { flex:1; min-width:0; font:inherit; padding:12px; border-radius:10px; border:1px solid #8886; background:transparent; color:inherit; }
  button { font:inherit; padding:12px 16px; border-radius:10px; border:0; background:var(--cl); color:#fff; cursor:pointer; }
  .rapidas { display:flex; gap:8px; width:100%; }
  .rapidas button { flex:1; background:var(--ej); color:var(--fg); }
  .llamar { border-top:0; border-bottom:1px solid #8883; flex-wrap:nowrap; }
</style>
</head>
<body>
<header><strong>Puente</strong><span id="estado">Conectando…</span></header>
<form id="llamar" class="llamar">
  <input id="numero" type="tel" inputmode="tel" autocomplete="off" placeholder="+569…" aria-label="Número del ejecutivo (E.164)">
  <button>📞 Llamar</button>
</form>
<main id="chat" aria-live="polite"></main>
<form id="f">
  <div class="rapidas">
    <button type="button" data-t="sí">Sí</button>
    <button type="button" data-t="no">No</button>
    <button type="button" data-t="yo no entender repetir por favor">No entendí</button>
  </div>
  <input id="t" autocomplete="off" placeholder="Escribe tu respuesta…" aria-label="Respuesta">
  <button>Enviar</button>
</form>
<script>
const chat = document.getElementById("chat"), estado = document.getElementById("estado");
const agregar = (clase, texto, nota) => {
  const d = document.createElement("div"); d.className = "msg " + clase; d.textContent = texto;
  if (nota) { const s = document.createElement("small"); s.textContent = nota; d.appendChild(s); }
  chat.appendChild(d); chat.scrollTop = chat.scrollHeight;
};
let ws;
function conectar() {
  // ?token=... en la URL de esta página se reenvía al WebSocket (CLIENTE_WS_TOKEN en la API).
  const token = new URLSearchParams(location.search).get("token") || "";
  ws = new WebSocket(location.origin.replace(/^http/, "ws") + "/twilio/cliente" + (token ? "?token=" + encodeURIComponent(token) : ""));
  ws.onopen = () => estado.textContent = "Conectado";
  ws.onclose = () => { estado.textContent = "Reconectando…"; setTimeout(conectar, 1500); };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.tipo === "ejecutivo_dice") agregar("ej", m.simple || m.texto, m.simple ? "Dijo: " + m.texto : "");
    if (m.tipo === "estado") agregar("sis", m.valor === "llamada_iniciada" ? "📞 Llamada iniciada" : "Llamada terminada");
  };
}
conectar();
const enviar = (texto) => {
  if (!texto.trim() || ws.readyState !== 1) return;
  ws.send(JSON.stringify({ tipo: "cliente_dice", texto }));
  agregar("cl", texto);
};
document.getElementById("f").onsubmit = (e) => { e.preventDefault(); const i = document.getElementById("t"); enviar(i.value); i.value = ""; };
const numero = document.getElementById("numero");
try { numero.value = localStorage.getItem("puente-numero") || ""; } catch {}
document.getElementById("llamar").onsubmit = async (e) => {
  e.preventDefault();
  try { localStorage.setItem("puente-numero", numero.value.trim()); } catch {}
  agregar("sis", "Llamando a " + numero.value.trim() + "…");
  const r = await fetch("/llamadas", { method: "POST", headers: { "Content-Type": "application/json" },
                                      body: JSON.stringify({ numero: numero.value.trim() }) });
  if (!r.ok) agregar("sis", "No se pudo llamar: " + ((await r.json().catch(() => ({}))).detail || r.status));
};
document.querySelectorAll("[data-t]").forEach(b => b.onclick = () => enviar(b.dataset.t));
</script>
</body>
</html>
