# CI: corre en cada PR hacia dev/main. Ajusta los comandos al stack del repo.
name: ci
on:
  pull_request:
    branches: [dev, main]
    paths-ignore: ["**/*.md", "docs/**"]
  push:
    branches: [dev, main]
    paths-ignore: ["**/*.md", "docs/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # hashFiles() no está permitido en el "if" de un job: se detecta el stack en un job previo.
  detect:
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.d.outputs.node }}
      python: ${{ steps.d.outputs.python }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        run: |
          echo "node=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "python=$([ -f pyproject.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  node:
    needs: detect
    if: ${{ needs.detect.outputs.node == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run typecheck --if-present
      - run: npm test --if-present -- --coverage
      - run: npm run build --if-present

  python:
    needs: detect
    if: ${{ needs.detect.outputs.python == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy . || true   # quitar "|| true" cuando el tipado esté limpio
      - run: uv run pytest --cov
